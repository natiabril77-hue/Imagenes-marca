<!DOCTYPE html><html><head><meta charset="utf-8">

<style>@font-face{font-family:Poppins;src:url('fonts/Poppins-Bold.ttf') format('truetype');font-weight:700;font-display:block}@font-face{font-family:Poppins;src:url('fonts/Poppins-Medium.ttf') format('truetype');font-weight:500;font-display:block}html,body{margin:0;overflow:hidden;background:transparent}svg{display:block;width:100vw;height:100vh}</style></head><body>
<svg id="s" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet">
<rect id="bg" width="1080" height="1920"/>
<text id="ms" font-family="Poppins" font-weight="700" font-size="150" fill="none">beautemps</text>
<g id="word"></g>
<g id="con" fill="none"><path id="bS"/><path id="pS"/><circle id="bR"/><circle id="pR"/><path id="dr" stroke-linejoin="round"/><ellipse id="hl"/></g>
<path id="ring" fill="none" stroke-linecap="round" stroke-width="8"/><g id="arc"></g>
</svg>
<script>
// ---- Sonido (se activa con el botón; los navegadores no permiten sonar solo) ----
window.SOUND=function(events){
 let ctx=null,on=false,prev=-1,out=null;
 const b=document.createElement('button');b.setAttribute('aria-label','Activar sonido');
 b.style.cssText='position:fixed;right:4%;bottom:5%;width:clamp(30px,9vw,46px);height:clamp(30px,9vw,46px);border-radius:50%;border:0;cursor:pointer;background:rgba(18,64,79,.82);display:flex;align-items:center;justify-content:center;padding:0;z-index:9;box-shadow:0 0 0 1px rgba(244,241,234,.35)';
 const ic=m=>`<svg viewBox="0 0 24 24" width="55%" height="55%" fill="none" stroke="#F4F1EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#F4F1EA"/>${m?'<path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>':'<path d="M16 9.5l5 5M21 9.5l-5 5"/>'}</svg>`;
 b.innerHTML=ic(false);document.body.appendChild(b);
 function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();out.gain.value=.9;
  const dry=ctx.createGain(),wet=ctx.createGain(),cv=ctx.createConvolver(),n=ctx.sampleRate*1.8,ir=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  cv.buffer=ir;wet.gain.value=.28;out.connect(dry);out.connect(cv);cv.connect(wet);dry.connect(ctx.destination);wet.connect(ctx.destination);}
 b.onclick=()=>{on=!on;if(on&&!ctx)init();if(ctx)ctx.resume();b.innerHTML=ic(on);b.setAttribute('aria-label',on?'Silenciar':'Activar sonido');if(on){window.T0=performance.now();prev=-1;}};
 const S={
  tone(f,t,d,g,type='sine',f2){const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.35);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.006);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(out);o.start(t);o.stop(t+d+.05);},
  air(t,d,g,f1,f2){const n=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),x=n.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
   const s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=n;bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+d);
   a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+d*.6);a.gain.linearRampToValueAtTime(0,t+d);s.connect(bp);bp.connect(a);a.connect(out);s.start(t);},
  plic(t){S.tone(1500,t,.16,.55,'sine',480);S.tone(700,t+.085,.14,.18,'sine',1250);S.tone(520,t+.02,.7,.05);},
  brote(t){S.tone(659.3,t,1.4,.22,'triangle');S.tone(1318.5,t,.9,.06);S.tone(1975.5,t+.01,.6,.03);},
  cierre(t){S.tone(987.8,t,1.6,.13,'triangle');S.tone(1975.5,t,1,.03);},
  brillo(t){S.tone(2637,t,.35,.05);S.tone(3951,t+.04,.25,.025);}
 };
 return function(tc){if(!on||!ctx){prev=tc;return;}if(tc<prev)prev=-1;const now=ctx.currentTime;
  events.forEach(([at,fn,...a])=>{if(prev<at&&at<=tc)S[fn](now,...a);});prev=tc;};
};

const Q=new URLSearchParams(location.search),END=Q.get('end')||'solo';
const TH=Q.get('theme')==='neg'?{bg:'#12404F',ink:'#F4F1EA'}:Q.get('theme')==='black'?{bg:'#000',ink:'#fff'}:{bg:'#F4F1EA',ink:'#12404F'};
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg';
const ease=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,seg=(t,a,b)=>ease((t-a)/(b-a)),lin=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),lerp=(a,b,k)=>a+(b-a)*k;
const back=x=>{x=Math.max(0,Math.min(1,x));return 1+2.6*Math.pow(x-1,3)+1.6*Math.pow(x-1,2);};
let G={};
function el(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e;}
function setup(){
 $('bg').setAttribute('fill',TH.bg);document.documentElement.style.background=TH.bg;['bS','pS','bR','pR','dr','ring'].forEach(i=>$(i).setAttribute('stroke',TH.ink));$('hl').setAttribute('fill',TH.bg);
 const m=$('ms'),x0=(1080-m.getComputedTextLength())/2;
 G.ch=[...'beautemps'].map((c,i)=>{const t=el('text',{'font-family':'Poppins','font-weight':700,'font-size':150,fill:TH.ink},$('word'));t.textContent=c;return {el:t,x:x0+m.getStartPositionOfChar(i).x};});
 G.arc=[...'BEAUTEMPS'].map(c=>{const t=el('text',{'font-family':'Poppins','font-weight':700,'font-size':42,fill:TH.ink,'text-anchor':'middle'},$('arc'));t.textContent=c;return t;});
 G.aw=G.arc.map(e=>e.getComputedTextLength());
}
function drop(cx,cy,r,h){let q=h>r?(h-r)/(.95*r):0;q=Math.min(1.2,q);const ax=cx,ay=cy-h,c1x=(.552*(1-q)+.14*q)*r,c1y=.5*q*r,c2y=(.552*(1-q)+.82*q)*r,b=.56*r;
 return `M${ax} ${ay}C${ax+c1x} ${ay+c1y} ${cx+r} ${cy-c2y} ${cx+r} ${cy}C${cx+r} ${cy+b} ${cx+b} ${cy+r} ${cx} ${cy+r}C${cx-b} ${cy+r} ${cx-r} ${cy+b} ${cx-r} ${cy}C${cx-r} ${cy-c2y} ${ax-c1x} ${ay+c1y} ${ax} ${ay}Z`;}
function render(t){
 const base=960,kA=seg(t,.6,1.6),bT=422,pT=556;
 G.ch.forEach((c,i)=>{let x=c.x,op=1,bl=0,sc=1;
  if(i===0)x=lerp(c.x,bT,kA);else if(i===7)x=lerp(c.x,pT,kA);
  else{const k=seg(t,.55+Math.abs(i-4)*.07,1.25+Math.abs(i-4)*.07);op=1-k;bl=k*8;sc=1-.3*k;x=lerp(c.x,510,k*.4);}
  if(i===0||i===7)op=1-lin(t,1.55,1.75);
  c.el.setAttribute('transform',`translate(${x} ${base}) scale(${sc})`);c.el.setAttribute('opacity',op);c.el.style.filter=bl?`blur(${bl}px)`:'';});
 $('con').setAttribute('opacity',t<1.55?0:lin(t,1.55,1.75));
 const kB=seg(t,1.75,2.55),kC=seg(t,2.6,3.45),kD=seg(t,3.25,3.85),sw=lerp(lerp(25,13,kB),20,kC);
 const r=lerp(30,82,kC),cy=lerp(base-42.5,860,kC),bcx=lerp(bT+55,540,kC),pcx=lerp(pT+55,540,kC);
 const hD=lerp(r,r*1.95,kD),bx=bcx+lerp(-33.5,0,kC),bBot=lerp(lerp(base,cy-r,kC),cy-hD,kD),bTop=lerp(base-lerp(111,330,kB),cy-r*1.95,kC),bW=sw*(1-lin(t,3.7,3.85));
 $('bS').setAttribute('d',bW>.3?`M${bx} ${bBot}L${bx} ${bTop}`:'');$('bS').setAttribute('stroke-width',bW);
 const px=pcx+lerp(-33.5,0,kC*.6);
 $('pS').setAttribute('d',`M${px} ${lerp(base-84,cy,kC)}L${px} ${lerp(base+lerp(39,280,kB),cy,seg(t,2.6,3.3))}`);$('pS').setAttribute('stroke-width',sw);$('pS').setAttribute('opacity',1-lin(t,3.1,3.3));
 [['bR',bcx],['pR',pcx]].forEach(([i,x])=>{const e=$(i);e.setAttribute('cx',x);e.setAttribute('cy',cy);e.setAttribute('r',r);e.setAttribute('stroke-width',sw);e.setAttribute('opacity',t<3.3?1:0);});
 let dr=r,h=hD;
 if(t>3.85){const w=Math.sin((t-3.85)*10)*Math.exp(-(t-3.85)*4)*.05;dr=r*(1+w);h=h*(1-w*.6);}
 const kE=seg(t,3.95,4.65),kF=seg(t,3.7,4.3),RING=END==='ring',er=RING?76:95,dcy=lerp(cy,RING?900+er*.48:880,kE);
 dr=lerp(dr,er,kE);h=lerp(h,er*1.95,kE);
 const d=$('dr');d.setAttribute('d',t>=3.3?drop(540,dcy,dr,h):'');d.setAttribute('stroke-width',lerp(sw,0,kF));d.setAttribute('fill',TH.ink);d.setAttribute('fill-opacity',kF);
 const kh=back(lin(t,4.1,4.5)),ex=540-.46*dr,ey=dcy+.08*dr,e=$('hl');
 e.setAttribute('cx',ex);e.setAttribute('cy',ey);e.setAttribute('rx',.13*dr*kh);e.setAttribute('ry',.22*dr*kh);e.setAttribute('transform',`rotate(18 ${ex} ${ey})`);e.setAttribute('opacity',kF>.9?1:0);
 const RR=225,RT=208,sp=8,tw=G.aw.reduce((a,b)=>a+b)+sp*8,a0=-Math.PI/2-tw/2/RT;let acc=0;
 G.arc.forEach((x,i)=>{const a=a0+(acc+G.aw[i]/2)/RT;acc+=G.aw[i]+sp;x.setAttribute('transform',`translate(${540+RT*Math.cos(a)} ${900+RT*Math.sin(a)}) rotate(${a*180/Math.PI+90})`);x.setAttribute('opacity',RING?seg(t,5+i*.07,5.25+i*.07):0);});
 const kc=RING?seg(t,4.3,5.3):0,sA=a0+tw/RT+.12,sweep=(a0-.12+2*Math.PI-sA)*kc,P=a=>`${540+RR*Math.cos(a)} ${900+RR*Math.sin(a)}`;
 $('ring').setAttribute('d',kc>0?`M${P(sA)}A${RR} ${RR} 0 ${sweep>Math.PI?1:0} 1 ${P(sA+sweep)}`:'');
}
Promise.race([document.fonts.load('700 150px Poppins'),new Promise(r=>setTimeout(r,1500))]).then(()=>{setup();if(Q.get('crop'))$('s').setAttribute('viewBox',Q.get('crop')==='w'?'0 610 1080 608':'40 560 1000 800');const t0=performance.now();
 window.T0=t0;const SND=SOUND(END==='ring'?[[.55,'air',1.2,.12,500,1800],[1.75,'air',1.7,.16,300,1500],[3.86,'plic'],[4.15,'brillo'],[4.35,'air',1.0,.06,1500,3500],[5.3,'cierre']]:[[.55,'air',1.2,.12,500,1800],[1.75,'air',1.7,.16,300,1500],[3.86,'plic'],[4.15,'brillo']]);setInterval(()=>{const tc=((performance.now()-T0)/1000)%8;SND(tc);render(Math.min(tc,7));},33);window.READY=true;});
</script></body></html>
